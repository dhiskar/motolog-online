  <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">

  <script>
    (function () {
      try {
        var raw = localStorage.getItem('motolog.state.v1');
        var st = raw ? JSON.parse(raw) : null;
        var t = st && st.settings && st.settings.theme ? st.settings.theme : 'auto';
        if (t === 'auto') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
      } catch (e) { /* default gelap */ }
    })();
  </script>
  <link rel="stylesheet" href="./assets/style.css">
